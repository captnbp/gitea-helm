name: gitea
annotations:
  category: DevelopmentTools
  licenses: Apache-2.0
  images: |
    - name: gitea
      image: docker.io/gitea/gitea:1.25.5-rootless
    - name: os-shell
      image: docker.io/bitnami/os-shell:12-debian-12-r16
    - name: postgresql
      image: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
apiVersion: v2
appVersion: 1.25.5
dependencies:
- name: common
  repository: oci://registry-1.docker.io/bitnamicharts
  tags:
  - bitnami-common
  version: 2.x.x
description: Gitea is a lightweight code hosting solution. Written in Go, features low resource consumption, easy upgrades and multiple databases.
home: https://lab.frogg.it/doca/gitea-helm
icon: https://gitea.com/assets/img/logo.svg
keywords:
  - gitea
maintainers:
  - name: Benoît Pourre
    email: benoit.pourre@gmail.com
    url: https://github.com/captnbp
sources:
  - https://lab.frogg.it/doca/gitea-helm
  - https://github.com/go-gitea/gitea
version: 1.0.3
